<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Icarus">
  <title>Icarus</title>
  <!--
    The mark is one shape read two ways. Four bars, each longer than the one
    above it, fan out like the feathers of a wing and align like the rows of a
    panel array; the disc above them is the sun the myth is about and the
    source this product's evidence is photographed under. Graphite carries the
    structure, ember marks only the sun, which is the same rule the pages
    follow: the accent marks the finding, never the whole.
  -->
  <circle cx="20" cy="14" r="6" fill="#ff682c" />
  <g fill="#202020">
    <rect x="20" y="26" width="18" height="6" rx="1" transform="rotate(-18 20 26)" />
    <rect x="17" y="36" width="26" height="6" rx="1" transform="rotate(-18 17 36)" />
    <rect x="14" y="46" width="34" height="6" rx="1" transform="rotate(-18 14 46)" />
    <rect x="11" y="56" width="42" height="6" rx="1" transform="rotate(-18 11 56)" />
  </g>
</svg>
