# Three required jobs on every push and pull request.
#
#   contract  the GenVM linter and validator, then the direct-mode suite
#   sweep     the mutation sweep, which is what proves the suite would notice
#   web       lint, types, unit tests, the web mutation sweep, a production
#             build, and one address everywhere
#
# The live runs are not here. They sign real transactions against Studio Next
# and take about an hour of real appeal windows, so they run by hand and their
# logs are committed:
#
#   node scripts/proofs.mjs <address>     the adjudication
#   node scripts/paths.mjs  <address>     terms, escrow and the refusal walls
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: contract - genvm-lint check + direct tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The GenVM bundle the linter loads is large; keep it between runs,
      # keyed on the tool versions and the contract itself.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/genvm-linter
            ~/.cache/gltest-direct
          key: genvm-${{ hashFiles('requirements.txt', 'contracts/icarus.py') }}
          restore-keys: genvm-
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: genvm-lint check contracts/icarus.py --json
      - run: python -m pytest tests/direct -q

  sweep:
    name: contract - mutation sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/genvm-linter
            ~/.cache/gltest-direct
          key: genvm-${{ hashFiles('requirements.txt', 'contracts/icarus.py') }}
          restore-keys: genvm-
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      # Every mutant must make the suite fail, and the control must pass. A
      # green suite proves the tests run; this proves they would notice.
      - run: python tests/mutation/mutate.py

  web:
    name: web - lint, types, tests, sweep, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm mutate
      - run: pnpm build
      # A judge clones and runs: the app, both proof logs, the committed
      # contract schema and the documents must name one deployment.
      - run: node scripts/check-address.mjs
